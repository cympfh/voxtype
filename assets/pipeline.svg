<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 210" width="670" height="210">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 直線の矢印 -->
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <line x1="102" y1="105" x2="118" y2="105" marker-end="url(#arrow)"/>
    <line x1="232" y1="105" x2="248" y2="105" marker-end="url(#arrow)"/>
    <!-- 校正 → モード (分岐) -->
    <path d="M 352 105 C 366 105, 366 40, 378 40" marker-end="url(#arrow)"/>
    <line x1="352" y1="105" x2="378" y2="105" marker-end="url(#arrow)"/>
    <path d="M 352 105 C 366 105, 366 170, 378 170" marker-end="url(#arrow)"/>
    <!-- モード → 合流点 -->
    <path d="M 472 40 C 486 40, 492 105, 504 105"/>
    <line x1="472" y1="105" x2="504" y2="105"/>
    <path d="M 472 170 C 486 170, 492 105, 504 105"/>
    <!-- 合流点 → 出力先 (分岐) -->
    <path d="M 516 105 C 530 105, 530 40, 542 40" marker-end="url(#arrow)"/>
    <line x1="516" y1="105" x2="542" y2="105" marker-end="url(#arrow)"/>
    <path d="M 516 105 C 530 105, 530 170, 542 170" marker-end="url(#arrow)"/>
  </g>
  <circle cx="510" cy="105" r="4" fill="#9ca3af"/>

  <!-- 箱 -->
  <g font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="12" y="83" width="90" height="44" rx="12" fill="#4b5563"/>
    <text x="57" y="111">マイク</text>

    <rect x="122" y="83" width="110" height="44" rx="12" fill="#4b5563"/>
    <text x="177" y="105" dy="0.35em">音声認識</text>

    <rect x="252" y="83" width="100" height="44" rx="12" fill="#0d9488"/>
    <text x="302" y="105" dy="0.35em">校正</text>

    <rect x="382" y="22" width="90" height="36" rx="10" fill="#4b5563"/>
    <text x="427" y="40" dy="0.35em">エコー</text>
    <rect x="382" y="87" width="90" height="36" rx="10" fill="#7c5cff"/>
    <text x="427" y="105" dy="0.35em">翻訳</text>
    <rect x="382" y="152" width="90" height="36" rx="10" fill="#db2777"/>
    <text x="427" y="170" dy="0.35em">質問</text>

    <rect x="546" y="22" width="110" height="36" rx="10" fill="#374151"/>
    <text x="601" y="40" dy="0.35em">クリップボード</text>
    <rect x="546" y="87" width="110" height="36" rx="10" fill="#374151"/>
    <text x="601" y="105" dy="0.35em">自動入力</text>
    <rect x="546" y="152" width="110" height="36" rx="10" fill="#374151"/>
    <text x="601" y="170" dy="0.35em">VRChat</text>
  </g>

  <!-- 補足 -->
  <g font-family="sans-serif" font-size="11" text-anchor="middle" fill="#9ca3af">
    <text x="302" y="146">オン/オフ可</text>
    <text x="427" y="203">どれか1つ</text>
    <text x="601" y="203">好きな組み合わせ</text>
  </g>
</svg>
